name: Engine memory regression

on:
  workflow_dispatch:
  push:
    branches: [fix/memory-growth]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: trailofbits
      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d
      - name: Build and test in the Nix development shell
        run: |
          nix develop --command bash -euo pipefail -c '
            cabal update
            cabal build all --enable-tests
            cabal test --test-show-details=direct --test-options="-p !/Symbolic/"
            python3 tests/memory/regression.py "$(cabal list-bin exe:echidna)"
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: memory-regression-results
          path: |
            memory-results/
            dist-newstyle/**/test/*.log

  macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: trailofbits
      - name: Build the macOS binary for the Wildcat smoke test
        run: |
          nix build .#packages.aarch64-darwin.echidna-redistributable
          tar -czf echidna-macos.tar.gz -C result/bin echidna
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: echidna-macos
          path: echidna-macos.tar.gz
